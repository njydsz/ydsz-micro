name: CI

# 云顶编码规范 §15.8 / §18.5 —— 全门禁 CI：
# PR 必跑质量门禁（lint / stylelint / type-check / 循环依赖 / 依赖合规 / 规范扫描 /
# i18n / importmap 锁 / 契约漂移 / 产物体积），契约漂移检查需检出后端仓库
# （ydsz-cloud）作为契约事实源，PR 与 push 均执行。
#
# §16.10 测试策略：按云顶编码规范分层推行测试体系
# 第一阶段：高复用组件 + 工具函数（覆盖率 ≥ 60%）—— Vitest 3.x + Vue Test Utils
# 第二阶段：子应用核心业务组件（覆盖率 ≥ 50%）
# 第三阶段：页面级集成测试（覆盖率 ≥ 30%）—— Playwright
# 参考 catpaw-always.md YDIZ-TEST-FE-001: 测试用例必须有明确断言，禁止无断言渲染测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 质量门禁（lint + 类型 + 架构守护）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22（vsh 需要 --experimental-strip-types）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint（零告警）
        run: pnpm lint

      - name: Stylelint（零告警）
        run: pnpm stylelint

      - name: 类型检查
        run: pnpm type-check

      - name: 循环依赖检查（零循环）
        run: pnpm vsh:check-circular

      - name: 依赖合规检查
        run: pnpm vsh:check-dep

      # 云顶编码规范合规扫描（§15.8，v1.0.3 接线）：P0/P1 计入失败，P2 仅提示
      - name: 编码规范合规扫描
        run: pnpm vsh:check-standard

      # 云顶编码规范 §16.10 测试门禁：执行 Vitest 单元测试 + 覆盖率报告
      - name: 单元测试 + 覆盖率（第一阶段：高复用组件 + 工具函数）
        run: pnpm test:unit

      # 归档 Vitest 测试报告（JUnit XML + 覆盖率）
      - name: 归档前端测试与覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-reports-${{ github.run_number }}
          path: |
            **/test-results/**/*.xml
            **/test-results/**/*.json
            **/coverage/**/lcov.info
            **/coverage/**/coverage-final.json
          if-no-files-found: warn
          retention-days: 30

      - name: 国际化 key 一致性校验
        run: pnpm check:i18n

      - name: importmap 版本锁与 vendor 产物一致性校验
        run: pnpm sync:shared-deps:check

  contract:
    name: API 契约漂移检查
    runs-on: ubuntu-latest
    # P0-2 修复：移除 `if: push || workflow_dispatch` 限制。
    #   此前 PR 不跑契约检查，漂移只有在合入 main 之后才暴露，门禁形同虚设。
    #   实测全量 8 服务约 97s，放在 PR 中完全可接受。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检出后端契约事实源（ydsz-cloud）
        uses: actions/checkout@v4
        with:
          repository: njydsz/ydsz-cloud
          ref: main
          path: ydsz-cloud
          fetch-depth: 1

      - name: 契约校验（后端接口变更必须已同步）
        env:
          YDSZ_CLOUD_ROOT: ${{ github.workspace }}/ydsz-cloud
        run: |
          python3 bash/gen-contract.py --check

      - name: 错误码契约校验（后端错误码变更必须已同步）
        env:
          YDSZ_CLOUD_ROOT: ${{ github.workspace }}/ydsz-cloud
        run: |
          node bash/gen-error-codes.mjs --check

  security:
    name: 安全扫描（依赖 + 密钥）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 依赖安全审计
        run: |
          pnpm audit --audit-level=high

      - name: 密钥扫描（防止密钥泄露）
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  notify:
    name: 契约变更通知
    runs-on: ubuntu-latest
    needs: contract
    if: github.ref == 'refs/heads/main' && failure()
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 发送契约变更通知
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          node bash/contract-notify.mjs

  # 产物体积门禁（P0-3 修复）：由原 e2e-smoke job 中与测试无关的门禁提取而来，
  # 从"仅手动触发"升级为 PR 必跑，门禁强度不降反升。
  # 构建期 bundle-budget 插件与 CI 期 check-size.mjs 共享 conf/budget.config.json
  # 单一预算源，两者同口径（gzip），杜绝此前 5MB/15MB 与 512KB/384KB 的双轨矛盾。
  bundle:
    name: 产物体积预算
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 内存说明：main-web 生产构建（6022 模块 + Brotli/Gzip 预压缩）峰值内存较高。
      # 仓库根 build 脚本默认 --max-old-space-size=8192，在 GHA 标准 runner（约 7GB RAM）
      # 上会因内存不足被系统终止（本地已复现：EXIT=-1 且无错误栈）。
      # 此处显式下调堆上限以适配 runner；若该步骤仍不稳定，应改由 nightly 或
      # 自托管 runner 承接，而不是把门禁降级为手动触发。
      - name: 构建 main-web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm build:main

      - name: 产物体积预算（gzip 口径，共享 budget.config.json）
        run: pnpm check:size

      - name: 共享依赖外置校验
        run: pnpm vsh:check-bundle
