name: CI

# 云顶编码规范 §18.5 —— 全门禁 CI：
# PR 必跑质量门禁（lint / type-check / 单测 / 循环依赖 / 依赖合规 / 契约漂移），
# 契约漂移检查需检出后端仓库（ydsz-cloud）作为契约事实源，PR 与 push 均执行。
# E2E 冒烟默认手动触发，待用例稳定后放开至 PR。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 质量门禁（lint + 类型 + 单测 + 架构守护）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22（vsh 需要 --experimental-strip-types）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: ESLint（零告警）
        run: pnpm lint

      - name: Stylelint（零告警）
        run: pnpm stylelint

      - name: 类型检查
        run: pnpm type-check

      - name: 循环依赖检查（零循环）
        run: pnpm vsh:check-circular

      - name: 依赖合规检查
        run: pnpm vsh:check-dep

      - name: 单元测试
        run: pnpm test

      - name: 国际化 key 一致性校验
        run: pnpm check:i18n

      - name: importmap 版本锁与 vendor 产物一致性校验
        run: pnpm sync:shared-deps:check

  contract:
    name: API 契约漂移检查
    runs-on: ubuntu-latest
    # P0-2 修复：移除 `if: push || workflow_dispatch` 限制。
    #   此前 PR 不跑契约检查，漂移只有在合入 main 之后才暴露，门禁形同虚设。
    #   实测全量 8 服务约 97s，放在 PR 中完全可接受。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检出后端契约事实源（ydsz-cloud）
        uses: actions/checkout@v4
        with:
          repository: njydsz/ydsz-cloud
          ref: main
          path: ydsz-cloud
          fetch-depth: 1

      - name: 契约校验（后端接口变更必须已同步）
        env:
          YDSZ_CLOUD_ROOT: ${{ github.workspace }}/ydsz-cloud
        run: |
          python3 bash/gen-contract.py --check

  security:
    name: 安全扫描（依赖 + 密钥）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 依赖安全审计
        run: |
          pnpm audit --audit-level=high

      - name: 密钥扫描（防止密钥泄露）
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  notify:
    name: 契约变更通知
    runs-on: ubuntu-latest
    needs: contract
    if: github.ref == 'refs/heads/main' && failure()
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 发送契约变更通知
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          node bash/contract-notify.mjs

  e2e-smoke:
    name: Playwright 冒烟（手动触发）
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建 main-web
        run: pnpm build:main

      - name: 产物体积预算 + 共享依赖外置校验
        run: |
          pnpm check:size
          pnpm vsh:check-bundle

      - name: 运行冒烟测试
        run: pnpm test:e2e

      - name: 上传失败截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: e2e/test-results/
          retention-days: 7
