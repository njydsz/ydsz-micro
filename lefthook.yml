# lefthook.yml — Git 提交期拦截（云顶规范 §18.6）
#
# 由根 package.json 的 prepare 脚本（lefthook install）自动安装到仓库自己的
# .git/hooks。所有命令统一使用 `pnpm exec` 前缀，保证 Windows（Git Bash / cmd）
# 与 POSIX 下二进制解析一致；不使用 npx。
#
# 钩子对本地全部生效（不加分发/CI 跳过逻辑）。
#
# @path lefthook.yml
pre-commit:
  parallel: true
  commands:
    eslint:
      # 仅对暂存的脚本类文件做 ESLint --fix（v4.1.0 起 bash/*.mts 纳入，移回退 mjs）
      glob: "*.{ts,tsx,vue,mts,mjs,js}"
      exclude: "(^|/)node_modules(/|$)|(^|/)dist(/|$)|(^|/)\\.turbo(/|$)|(^|/)coverage(/|$)|(^|/)archived(/|$)|(^|/)api/generated(/|$)|^pnpm-lock\\.yaml$|(^|/)build\\.config\\.ts$|^eslint\\.config\\.mjs$|^commitlint\\.config\\.mjs$|^stylelint\\.config\\.mjs$|^.changeset/config\\.json$"
      run: NODE_OPTIONS=--max-old-space-size=8192 pnpm exec eslint --fix --max-warnings=0 {staged_files}
    stylelint:
      # 仅对暂存的样式类文件做 Stylelint --fix
      glob: "*.{vue,scss,css}"
      exclude: |
        (^|/)node_modules(/|$)|
        (^|/)dist(/|$)|
        (^|/)\.turbo(/|$)|
        (^|/)coverage(/|$)
      run: pnpm exec stylelint --fix --max-warnings=0 {staged_files}
    cspell:
      # 仅对暂存的文件做 cspell 拼写检查（配置见 cspell.json；v4.1.0 新增 *.mts）
      glob: "*.{ts,tsx,vue,mts}"
      exclude: |
        (^|/)node_modules(/|$)|
        (^|/)dist(/|$)|
        (^|/)\.turbo(/|$)
      run: pnpm exec cspell --no-progress --no-summary {staged_files}

commit-msg:
  commands:
    commitlint:
      # 对提交信息做 Conventional Commits 校验（配置见 commitlint.config.mjs）
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    vitest:
      # 云顶编码规范 §16.10 — pre-push 运行 Vitest 测试 + 覆盖率门禁（Phase 1 最低 5%，Phase 4 目标 ≥ 40%）
      # 仅对 apps/ comm/ main/ 下变更的子项目执行对应测试
      run: pnpm test:unit -- --run
      # 非零退出码阻断推送（默认行为）
    type-check:
      # v5.0 全量 TS — pre-push 增量类型检查（turbo 按输入哈希命中缓存，无变更子项目毫秒级跳过）
      run: pnpm type-check
    type-check:chrome:
      # Chrome 扩展独立 type-check（独立 tsconfig，不在 turbo 流水线内）
      run: pnpm type-check:chrome
