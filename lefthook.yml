# lefthook.yml — 云顶编码规范质量门禁
# 触发时机：
#   pre-commit  并行执行 ESLint / Prettier / Stylelint（仅检查暂存文件，保证增量速度）
#   pre-push    全量执行 类型检查 / vsh 三件套 / 契约与错误码漂移校验
#   commit-msg  Conventional Commits 校验（commitlint）
#   post-merge  自动同步依赖
#
# P0-2 修复说明（2026-08-29）：
#   此前 pre-commit / pre-push 的绝大部分门禁被整段注释，注释理由为
#   "node_modules 中 fast-glob 依赖损坏"。实测该前提已不成立：
#     - eslint  v9.39.5  可用
#     - prettier 3.9.6   可用
#     - vitest  4.1.10   可用
#     - tsc     5.9.3    可用
#   真正缺失的是 stylelint：它未在根 package.json 声明，仅作为传递依赖存在于
#   .pnpm store，根级无法解析（幻影依赖）。已在根 package.json 补声明
#   stylelint + @ydsz/stylelint-config，待 pnpm install 成功链接后启用 stylelint 门禁。
#   audit 保持禁用：私有 npm 仓库（npmmirror）不支持 audit 端点，属环境限制非配置遗漏。

pre-commit:
  parallel: true
  commands:
    eslint:
      glob: "*.{ts,tsx,vue,js,mjs,cjs}"
      run: pnpm exec eslint {staged_files} --max-warnings=0 --no-warn-ignored
    prettier:
      glob: "*.{ts,tsx,vue,js,mjs,cjs,json,md,scss,css,html,yml,yaml}"
      run: pnpm exec prettier --check {staged_files}
    # stylelint 门禁（2026-09-01 P0-1 修复后启用）：
    # 根因已消除——postcss-html / postcss-scss 已通过 catalog 声明并链接
    # （@ydsz/stylelint-config + 根 package.json），stylelint 全量检查 exit=0。
    stylelint:
      glob: "*.{vue,scss,css}"
      run: pnpm exec stylelint {staged_files} --max-warnings=0

pre-push:
  parallel: true
  commands:
    type-check:
      run: pnpm type-check
    # 测试代码已按云顶编码规范 15.10 全量移除（提交 dc5472f4a），
    # `pnpm test` 脚本已不存在，此处引用会导致 pre-push 整组门禁失效（2026-09-01 P0-2 修复）。
    vsh-check-dep:
      run: node --experimental-strip-types ./bash/vsh/bin/vsh.mjs check-dep
    vsh-check-arch:
      run: node --experimental-strip-types ./bash/vsh/bin/vsh.mjs check-arch
    vsh-check-circular:
      run: node --experimental-strip-types ./bash/vsh/bin/vsh.mjs check-circular
    # P0-8: 契约漂移门禁 — 后端 OpenAPI 变更后未重新生成则阻断推送
    # 依赖: 后端仓库（默认 D:\Code\open\ydsz-cloud，可用 YDSZ_CLOUD_ROOT 覆盖）
    # 注意: --check 已修为纯只读（此前会改写 api/*.ts 并归档文件，污染工作区）
    gen-contract-check:
      run: pnpm gen:contract:check
    # P0-3: 错误码漂移门禁 — 后端错误码注册表变更后未重新生成则阻断推送（2026-09-01）
    gen-error-codes-check:
      run: pnpm gen:error-codes:check
    # 临时禁用：私有 npm 仓库（npmmirror）不支持 audit 端点，属环境限制
    # audit:
    #   run: pnpm audit --audit-level=high

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "$1"

post-merge:
  commands:
    install:
      run: pnpm install
