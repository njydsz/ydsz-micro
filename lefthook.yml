# Lefthook 配置 — Git hooks 自动化门控
# 文档: https://github.com/evarto-io/lefthook

pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,vue,css,scss,mjs,cjs,json,md}"
      run: pnpm prettier --check --write {staged_files}
      stage_fixed: true
    eslint:
      glob: "*.{ts,tsx,vue,mjs,cjs}"
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    stylelint:
      glob: "*.{css,scss,vue}"
      run: pnpm stylelint --fix {staged_files}
      stage_fixed: true
    cspell:
      glob: "*.{ts,tsx,vue,mjs,cjs,md,json}"
      run: pnpm cspell {staged_files}

pre-push:
  parallel: true
  commands:
    check:
      run: pnpm check
    typecheck:
      run: pnpm check:type
    test-unit:
      run: pnpm test:unit

commit-msg:
  commands:
    commitlint:
      run: pnpm commitlint --edit
