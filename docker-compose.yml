version: '3.8'

services:
  # ==================== Frontend (Nginx) ====================
  remi-micro:
    build:
      context: .
      dockerfile: bash/deploy/Dockerfile
    container_name: remi-micro
    ports:
      - "5600:8080"
    depends_on:
      - gateway
    networks:
      - remi-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== Backend Gateway (9000) ====================
  gateway:
    image: remi/gateway:latest
    container_name: remi-gateway
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== System Service (9001) ====================
  system:
    image: remi/system:latest
    container_name: remi-system
    ports:
      - "9001:9001"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Userinfo Service (9002) ====================
  userinfo:
    image: remi/userinfo:latest
    container_name: remi-userinfo
    ports:
      - "9002:9002"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Nextwiki Service (9003) ====================
  nextwiki:
    image: remi/nextwiki:latest
    container_name: remi-nextwiki
    ports:
      - "9003:9003"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Message Service (9004) ====================
  message:
    image: remi/message:latest
    container_name: remi-message
    ports:
      - "9004:9004"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Workflow Service (9005) ====================
  workflow:
    image: remi/workflow:latest
    container_name: remi-workflow
    ports:
      - "9005:9005"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Cronjob Service (9006) ====================
  cronjob:
    image: remi/cronjob:latest
    container_name: remi-cronjob
    ports:
      - "9006:9006"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== LiteRule Service (9007) ====================
  literule:
    image: remi/literule:latest
    container_name: remi-literule
    ports:
      - "9007:9007"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Agent Service (9008) ====================
  agent:
    image: remi/agent:latest
    container_name: remi-agent
    ports:
      - "9008:9008"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

  # ==================== Project Service (9009) ====================
  project:
    image: remi/project:latest
    container_name: remi-project
    ports:
      - "9009:9009"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    networks:
      - remi-net
    restart: unless-stopped

networks:
  remi-net:
    driver: bridge
    name: remi-network
