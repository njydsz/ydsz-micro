version: '3.8'

# =====================================================================
# YDSZ 全栈编排 — 微服务 + 中间件一键拉起
# --------------------------------------------------------------------
#  用法: docker-compose up -d
#  环境变量: 通过 .env 加载（cp .env.example .env 后编辑）
#
#  服务端口映射（宿主机 → 容器）:
#    Nacos:        8848 / 9848 (HTTP / gRPC)
#    PostgreSQL:   5432
#    Redis:        6379
#    RocketMQ:     9876 (NameServer) / 10911 (Broker)
#    MinIO:        9000 (API) / 9001 (Console)
#    ES (可选):    9200 / 9300
#    ydsz-gateway: 9000
#    ydsz-micro:   5600 (前端 Nginx)
# =====================================================================

services:
  # ==================== Nacos（服务发现 + 配置中心） ====================
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: YDSZ-nacos
    ports:
      - "${NACOS_PORT_HTTP:-8848}:8848"
      - "${NACOS_PORT_GRPC:-9848}:9848"
    environment:
      - MODE=standalone
      - JVM_Xms=512m
      - JVM_Xmx=512m
      - NACOS_AUTH_ENABLE=true
      - NACOS_AUTH_TOKEN=${NACOS_AUTH_TOKEN:-Y2xvdWRzeXN0ZW1zMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=}
      - NACOS_AUTH_TOKEN_EXPIRE_SECONDS=18000
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    networks:
      - YDSZ-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ==================== PostgreSQL 18 (主库) ====================
  postgres:
    image: postgres:18-alpine
    container_name: YDSZ-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-ydsz}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Ydsz_Pg_2026}
      - POSTGRES_DB=${POSTGRES_DB:-ydsz_cloud}
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 初始化 SQL 脚本（挂载到容器内 /docker-entrypoint-initdb.d/）
      - ./../ydsz-cloud/data/postgre:/docker-entrypoint-initdb.d/:ro
    networks:
      - YDSZ-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ydsz} -d ${POSTGRES_DB:-ydsz_cloud}"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==================== Redis 7 (缓存) ====================
  redis:
    image: redis:7-alpine
    container_name: YDSZ-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-Ydsz_Redis_2026}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - YDSZ-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Ydsz_Redis_2026}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ==================== RocketMQ 5.x (消息队列) ====================
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: YDSZ-rocketmq-namesrv
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      - JAVA_OPT_EXT=-Xms256m -Xmx256m
    command: sh mqnamesrv
    networks:
      - YDSZ-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "netstat -ln | grep 9876"]
      interval: 15s
      timeout: 5s
      retries: 10

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: YDSZ-rocketmq-broker
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_BROKER_PORT2:-10909}:10909"
    environment:
      - NAMESRV_ADDR=rocketmq-namesrv:${ROCKETMQ_NAMESRV_PORT:-9876}
      - JAVA_OPT_EXT=-Xms512m -Xmx512m
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.1/conf/broker.conf
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped
    volumes:
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs

  # ==================== MinIO (对象存储) ====================
  minio:
    image: minio/minio:RELEASE.2025-07-18T21-07-30Z
    container_name: YDSZ-minio
    ports:
      - "${MINIO_API_PORT:-9010}:9000"
      - "${MINIO_CONSOLE_PORT:-9011}:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-ydszminio}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-Ydsz_Minio_2026}
      - MINIO_SITE_REGION=cn-east-1
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - YDSZ-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 10

  # ==================== Frontend (Nginx) ====================
  ydsz-micro:
    build:
      context: .
      dockerfile: bash/deploy/Dockerfile
    container_name: ydsz-micro
    ports:
      - "5600:8080"
    depends_on:
      - gateway
    networks:
      - YDSZ-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ==================== Backend Gateway (9000) ====================
  gateway:
    image: YDSZ/gateway:latest
    container_name: YDSZ-gateway
    ports:
      - "${GATEWAY_PORT:-9000}:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== System Service (9001) ====================
  # 仅内部网络访问（通过 gateway 对外），不暴露主机端口
  system:
    image: YDSZ/system:latest
    container_name: YDSZ-system
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== Userinfo Service (9002) ====================
  userinfo:
    image: YDSZ/userinfo:latest
    container_name: YDSZ-userinfo
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== Nextwiki Service (9003) ====================
  nextwiki:
    image: YDSZ/nextwiki:latest
    container_name: YDSZ-nextwiki
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== Message Service (9004) ====================
  message:
    image: YDSZ/message:latest
    container_name: YDSZ-message
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== Workflow Service (9005) ====================
  workflow:
    image: YDSZ/workflow:latest
    container_name: YDSZ-workflow
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== Cronjob Service (9006) ====================
  cronjob:
    image: YDSZ/cronjob:latest
    container_name: YDSZ-cronjob
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== LiteRule Service (9007) ====================
  literule:
    image: YDSZ/literule:latest
    container_name: YDSZ-literule
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

  # ==================== Agent Service (9008) ====================
  agent:
    image: YDSZ/agent:latest
    container_name: YDSZ-agent
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xms256m -Xmx512m
    depends_on:
      nacos:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - YDSZ-net
    restart: unless-stopped

networks:
  YDSZ-net:
    driver: bridge
    name: YDSZ-network

volumes:
  nacos-data:
    name: YDSZ-nacos-data
  nacos-logs:
    name: YDSZ-nacos-logs
  postgres-data:
    name: YDSZ-postgres-data
  redis-data:
    name: YDSZ-redis-data
  rocketmq-broker-data:
    name: YDSZ-rocketmq-broker-data
  rocketmq-broker-logs:
    name: YDSZ-rocketmq-broker-logs
  minio-data:
    name: YDSZ-minio-data
