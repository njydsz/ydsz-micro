<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="A Modern Back-end Management System" />
    <meta name="keywords" content="YDSZ Admin Vue3 Vite" />
    <meta name="author" content="YDSZ" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title><%= VITE_APP_TITLE %></title>
    <link rel="icon" href="/favicon.ico" />
    <!-- Google Fonts: preconnect 字体资源域，减少首请求延迟 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Google Fonts 字体加载 — Inter Variable + JetBrains Mono
      - display=swap: 字体加载完成前使用回退字体，避免 FOIT（不可见文本闪烁）
      - Inter Variable: 含 opsz(14..32) + wght(100..900) 双可变轴
      - JetBrains Mono: wght(400..700) 可变轴
    -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=JetBrains+Mono:wght@400..700&display=swap" />
    <!-- C4: preconnect 外部资源域，减少首请求延迟 -->
    <link rel="preconnect" href="https://hm.baidu.com" crossorigin />
    <link rel="dns-prefetch" href="https://hm.baidu.com" />
    <script>
      // 生产环境下注入百度统计
      if (window._YDSZ_ADMIN_PRO_APP_CONF_) {
        var _hmt = _hmt || [];
        (function () {
          var hm = document.createElement('script');
          hm.src =
            'https://hm.baidu.com/hm.js?b38e689f40558f20a9a686d7f6f33edf';
          var s = document.getElementsByTagName('script')[0];
          s.parentNode.insertBefore(hm, s);
        })();
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
