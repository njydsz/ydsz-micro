# ==================== Sub-App Static Assets ====================
# 此文件由 bash/gen-nginx-conf.mjs 从 MICRO_APPS 自动生成，请勿手动修改。
# 新增子应用后运行: pnpm run gen:nginx

    location /remi-userinfo-web/ {
      alias /usr/share/nginx/html/remi-userinfo-web/;
      try_files $uri $uri/ /remi-userinfo-web/index.html;
      add_header Access-Control-Allow-Origin *;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

