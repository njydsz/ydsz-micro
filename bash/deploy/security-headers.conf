# ==================== Security Response Headers ====================
# 由 bash/deploy/nginx.conf 与自动生成的 nginx-sub-apps.conf 在每个 server/location
# 层级 include。
#
# 为什么不是只放在 http 层：nginx 的 add_header 遵循"当前层级一旦声明自己的
# add_header，就完全不再继承上层 add_header"的规则。本文件所在配置大量使用
# Cache-Control/CORS 的 add_header，若安全头只写在 http 层，这些 location 的
# 响应会静默丢掉 CSP、X-Frame-Options、nosniff、HSTS 等全部安全头。
# 因此：每个声明了 add_header 的 location 必须重新 include 本文件。
#
# CSP 说明（v3.4）：
# - 不使用 'unsafe-eval'：ESM 生产构建无需 eval；
# - 'strict-dynamic'：信任主应用加载的带 hash 模块并允许其动态加载子模块。
#   注意不要在此追加 'unsafe-inline'：strict-dynamic 生效时该值被现代浏览器忽略，
#   但会让不支持 strict-dynamic 的旧浏览器放行全部内联脚本，等于单方面放宽策略。
# - 'unsafe-inline' 仅保留在 style-src（UI 组件运行时注入样式需要）。
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none';" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# X-XSS-Protection 已被现代浏览器废弃，且会被 CSP 覆盖，此处不再下发。
# X-CSRF-Token 空值头在原配置中不具备语义，改为只下发要求客户端携带的头名。
add_header X-CSRF-Header "X-Requested-With" always;
