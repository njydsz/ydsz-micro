worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  types {
    application/javascript  js mjs;
    text/css                css;
    text/html               html;
    application/json        json;
    application/wasm        wasm;
    image/svg+xml           svg;
  }

  # Logging
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for" '
                  'rt=$request_time uct="$upstream_connect_time" '
                  'uht="$upstream_header_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  server_tokens off;
  client_max_body_size 100m;

  # Brotli 压缩（优先级高于 Gzip）
  brotli on;
  brotli_comp_level 6;
  brotli_min_length 1024;
  brotli_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/x-javascript text/javascript
               image/svg+xml application/wasm;

  # Gzip 压缩（Brotli 不支持时的降级方案）
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/json
             application/javascript application/xml+rss
             application/x-javascript text/javascript
             image/svg+xml application/wasm;
  gzip_disable "msie6";

  # 静态预压缩优先（构建产物 .gz/ .br）
  gzip_static on;
  brotli_static on;

  # ==================== Security Headers ====================
  # 单一口径见 bash/deploy/security-headers.conf（CSP / XFO / nosniff / Referrer /
  # Permissions-Policy / HSTS / CSRF 提示头）。
  #
  # 注意：add_header 不跨层继承——任何声明了自身 add_header 的 server/location 块
  # 都会完全丢掉这一层的头部，所以 nginx-sub-apps.conf 与各静态 location 内部
  # 必须再次 include 同一文件；本行只覆盖"自身未声明 add_header"的 location
  # （如 /api/、/ws/ 反向代理）。
  include /etc/nginx/security-headers.conf;

  # ==================== Upstream: Backend Gateway ====================
  upstream backend_gateway {
    server gateway:9000;
    keepalive 32;
  }

  # ==================== Main App ====================
  server {
    listen 8080;
    server_name _;

    # Main app — micro-kernel micro-frontend host
    # 缓存分层（B0-5）：外层块 = 入口 HTML（no-store，发版即生效）；
    # 嵌套块 = 带内容 hash 的 JS/CSS（immutable 1y）与图片/字体（30d）。
    location / {
      root /usr/share/nginx/html/main;
      index index.html;
      # SPA history fallback：只兜底主应用入口
      try_files $uri $uri/ /index.html;

      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;

      # sourcemap 禁止对外暴露（hidden sourcemap 仅上传符号化后端）
      # 嵌套块一旦存在，nginx 就不再回到 server 层正则，因此必须在此重复拦截
      location ~* \.map$ {
        access_log off;
        return 404;
      }

      # hash 资源缺失即 404：避免 SPA 兜底把 index.html 当 JS/CSS 返回（白屏根因）
      location ~* \.(?:js|css|wasm)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
      }

      location ~* \.(?:png|jpe?g|gif|svg|webp|avif|ico|bmp|woff2?|ttf|otf|eot|mp4|webm)$ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Access-Control-Allow-Origin "*" always;
      }
    }

    # ==================== API Proxy ====================
    # 单一剥离点契约（P0-A1 / YDIZ-API-001）：浏览器发出 /api/**，网关按 /api/** 匹配路由
    # 后再由 StripPrefix=1 剥掉 /api。此处若再 rewrite 就是剥两次：/api/user/list 会变成
    # /user/list，网关 Path 断言全部不命中 → 生产全量 404。dev 侧 vite proxy 同构（不 rewrite）。
    # 版本协商走 X-Api-Version 请求头（P0-A2），网关不路由 /api/v1/**。
    location /api/ {
      proxy_pass http://backend_gateway;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_connect_timeout 30s;
      proxy_send_timeout 60s;
      proxy_read_timeout 60s;
      proxy_buffering off;
    }

    # ==================== WebSocket Proxy ====================
    location /ws/ {
      proxy_pass http://backend_gateway;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }

    # ==================== Sub-App Static Assets ====================
    # Each sub-app is served from its own directory under /usr/share/nginx/html/
    # location 片段由 bash/gen-nginx-conf.mts 从 MICRO_APPS 自动生成，请勿手动修改。
    # 新增子应用后运行: pnpm run gen:nginx（CI 用 pnpm run gen:nginx:check 校验漂移）
    include /etc/nginx/nginx-sub-apps.conf;

    # ==================== Sourcemap Protection ====================
    # v4.4.0: 生产环境禁止对外暴露 .map 文件（hidden sourcemap 仅上传后端做符号化）
    # 命中即 404，避免源码结构泄露；同时防止 SPA fallback 把 .map 请求兜底成 index.html
    # 兜底性质：主应用与子应用块内已各自拦截，此处覆盖无嵌套块的 location
    location ~* \.(?:js|css)\.map$ {
      return 404;
    }

    # ==================== Static Asset Caching ====================
    # B0-5 移除：此处原有的两条 server 级正则（js/css/字体/图片）必须删除。
    # nginx 的 server 级正则在"最佳前缀匹配不含嵌套 location"时优先于前缀匹配，
    # 于是它们会同时劫持 /api/、/ws/ 与子应用请求：
    #   1) 块内没有 root/alias，只能靠 server 级 root，路径推导与应用目录错位；
    #   2) 块内声明了 add_header，按不继承规则会静默丢掉 http 层全部安全头；
    #   3) 对所有静态文件无差别 immutable，入口 HTML 一旦命中即发版失效；
    #   4) 硬编码 X-CDN-Cache "HIT" 与真实缓存状态无关，是误导性观测数据。
    # 现由 location / 与 nginx-sub-apps.conf 的分层块就近处理。

    # ==================== Health Check ====================
    # 浅探针：nginx 静态返回，验证 Pod 本身存活（livenessProbe 用）
    # 用 default_type 而不是 add_header Content-Type：后者会让本块声明自有
    # add_header，按不继承规则丢掉 http 层安全头，且与响应已有 Content-Type 重复。
    location /health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"UP","app":"ydsz-micro"}';
    }

    # 深探针：代理到后端网关健康检查，验证全链路连通性（readinessProbe 用）
    # 后端不可达时返回 502，K8s 不会将流量导入此 Pod，避免前端 502 级联故障
    location /health/deep {
      access_log off;
      proxy_pass http://backend_gateway/actuator/health;
      proxy_http_version 1.1;
      proxy_connect_timeout 3s;
      proxy_read_timeout 5s;
      proxy_set_header Host $host;
      proxy_set_header X-Health-Check "deep";
    }

    # ==================== Error Pages ====================
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html/main;
    }
  }
}
